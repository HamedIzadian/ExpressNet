# Netlify configuration — static site, no build step.
[build]
  publish = "."
  command = ""

# Long-cache immutable static assets (css/js/svg under /assets).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers for every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Netlify serves clean URLs (/products -> products.html) and uses
# 404.html for not-found pages automatically — no redirects needed.
